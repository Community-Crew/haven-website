name: Test and Deploy Backend

on:
  push:
    branches:
      - production
  workflow_run:
    workflows: ["Promote Tag to Production"]
    types:
      - completed
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo_pgsql, tokenizer, xml

      - name: Prepare the environment
        run: cp .env.example .env

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Setup composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        run: vendor/bin/pest
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_DATABASE: test
          DB_PASSWORD: postgres

  deploy:
    needs: test
    runs-on: [self-hosted, haven-api-deploy]

    steps:
      - name: Deploy to production
        run: |
          cd /var/www/haven-api
          git fetch origin production
          git reset --hard origin/production
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan config:clear
          php artisan migrate --force
          php artisan shield:generate --all --panel=admin --option=permissions
          php artisan tinker --execute="\$r = \Spatie\Permission\Models\Role::firstOrCreate(['name' => config('filament-shield.super_admin.name'), 'guard_name' => 'web']); \$r->syncPermissions(\Spatie\Permission\Models\Permission::pluck('id'));"
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          sudo systemctl reload php8.4-fpm
